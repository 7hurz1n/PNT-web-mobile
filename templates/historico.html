<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='historico.css') }}">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin-top: 10px;
            cursor: pointer;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
    </style>
    <title>historico de Ocorrencias</title>
</head>
<body>
    <h1>Historico de Ocorrencias</h1>
    <table>
        <tr>
            <th>ID</th>
            <th>Ocorrencia</th>
            <th>Detalhes</th>
            <th>Local</th>
            <th>Data</th>
            <th>Hora</th>
        </tr>
        {% for ocorrencia in ocorrencias %}
        <tr>
            <td>{{ ocorrencia.id }}</td>
            <td>{{ ocorrencia.ocorrencia }}</td>
            <td>{{ ocorrencia.detalhes }}</td>
            <td>{{ ocorrencia.local }}</td>
            <td>{{ ocorrencia.data }}</td>
            <td>{{ ocorrencia.hora }}</td>
            <td><a href="{{ url_for('app.editar', id=ocorrencia.id) }}">Editar</a></td>
        </tr>
        {% endfor %}
    </table>
    <button><a href="{{ url_for('app.home') }}">Voltar para a página inicial</a></button>
</body>
