<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            color: #333;
        }
        form {
            margin-top: 20px;
        }
        label {
            font-weight: bold;
        }
        select, textarea, input {
            margin-bottom: 10px;
            padding: 5px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
    <title>editar</title>
</head>
<body>
    <h1>Editar Ocorrencias</h1>
    <form method="POST">
        <label for="ocorrenciaForm">Ocorrencia:</label>
        <select id="ocorrenciaForm" name="ocorrenciaForm" required>
            <option value="barulho">Barulho</option>
            <option value="vandalismo">Vandalismo</option>
            <option value="Vaga de Garagem bloqueada">Vaga de Garagem bloqueada</option>
            <option value="Uso indevido da area comum">Uso indevido da area comum</option>
            <option value="outros">Outros (especificar em detalhes)</option>
        </select><br><br>

        <label for="detalhesForm">Detalhes:</label>
        <textarea id="detalhesForm" name="detalhesForm" required>{{ ocorrencia.detalhes }}</textarea><br><br>

        <label for="localForm">Local:</label>
        <select id="localForm" name="localForm" required>
            <option value="andar1">Andar 1</option>
            <option value="andar2">Andar 2</option>
            <option value="andar3">Andar 3</option>
            <option value="terraco">Terraço</option>
            <option value="garagem">Garagem</option>
        </select><br><br>

        <label for="dataForm">Data:</label>
        <input type="date" id="dataForm" name="dataForm" value="{{ ocorrencia.data }}" required><br><br>

        <label for="horaForm">Hora:</label>
        <input type="time" id="horaForm" name="horaForm" value="{{ ocorrencia.hora }}" required><br><br>

        <button type="submit">Salvar</button>
    </form>
</body>
</html>
