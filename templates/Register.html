<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            color: #333;
        }
        form {
            margin-top: 20px;
        }
        label {
            font-weight: bold;
        }
        select, textarea, input {
            margin-bottom: 10px;
            padding: 5px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Registre sua ocorrencia</h1>
    <form action="{{ url_for('app.register') }}" method="post">
        <label for="ocorrenciaForm">Ocorrencia:</label><br>
        <textarea name="ocorrenciaForm"></textarea><br>
        <label for="detalhesForm">Detalhes:</label><br>
        <textarea name="detalhesForm"></textarea><br>
        <label for="localForm">Local:</label><br>
        <textarea name="localForm"></textarea><br>
        <label for="dataForm">Data:</label><br>
        <input type="date" name="dataForm"><br><br>
        <label for="horaForm">Hora:</label><br>
        <input type="time" name="horaForm"><br><br>
        <button type="submit">Register</button>
    </form>
</body>
</html>
