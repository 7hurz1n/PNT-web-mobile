<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            color: #333;
        }
        p {
            font-size: 18px;
        }
    </style>
    <title>Ocorrência Deletada</title>
</head>
<body>
    <h1>Ocorrência Deletada</h1>
    <p>A ocorrência "{{ ocorrencia }}" foi deletada com sucesso.</p>
    <p>Detalhes: {{ detalhes }}</p>
    <p>Local: {{ local }}</p>
    <p>Data: {{ data }}</p>
    <p>Hora: {{ hora }}</p>
    <button><a href="{{ url_for('app.historico') }}">Voltar ao Histórico</a></button>
</body>
</html>
